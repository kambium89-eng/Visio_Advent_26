<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#305448">
    <meta name="description" content="24 Tage voller Überraschungen. Unser Weihnachtsdorf wächst jeden Tag um ein Häuschen – und einen kleinen Moment für dich.">
    <title>Adventskalender 2026 · VisioCoaching</title>
    <link rel="preload" href="assets/fonts/AlexBrush-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="style.css?v=clouds-2">
    <script src="vendor/marked.umd.js" defer></script>
    <script src="memory-clouds.js?v=clouds-2" defer></script>
    <script src="script.js?v=clouds-3" defer></script>
</head>
<body class="is-arriving">
    <a class="skip-link" href="#day-content">Zum Tagesinhalt</a>
    <div class="snowfall" id="snowfall" aria-hidden="true"></div>
    <div class="preview-label" id="preview-label" hidden></div>

    <header class="page-header">
        <p class="brand">VisioCoaching <span aria-hidden="true">✧</span> Advent 2026</p>
        <h1>Adventskalender <span>2026</span></h1>
        <p class="subtitle">24 Tage voller Überraschungen</p>
        <div class="header-ornament" aria-hidden="true"><span></span>✧<span></span></div>
    </header>

    <main id="main">
        <article class="day-content paper" id="day-content" aria-labelledby="day-title" tabindex="-1">
            <header class="content-heading">
                <p class="eyebrow" id="day-eyebrow"></p>
                <h2 id="day-title"></h2>
                <p class="day-intro" id="day-intro"></p>
                <p class="day-guidance" id="day-guidance" hidden></p>
            </header>
            <div id="content-body"></div>
        </article>
        <noscript><p class="paper noscript">Bitte aktiviere JavaScript, um die Häuschen und Tagesinhalte zu öffnen.</p></noscript>
    </main>

    <footer class="village" id="village" aria-label="Unser wachsendes Weihnachtsdorf">
        <div class="village-caption"><p>Unser kleines Weihnachtsdorf</p><span id="village-count"></span></div>
        <div class="village-scene" id="village-scene">
            <div class="snow-bank snow-bank-back" aria-hidden="true"></div>
            <img class="village-tree tree-left" src="assets/web/decorations/tree_1.webp" alt="" width="222" height="300">
            <img class="village-tree tree-right" src="assets/web/decorations/tree_2.webp" alt="" width="227" height="300">
            <img class="snow-patch snow-patch-left" src="assets/web/decorations/snow_1.webp" alt="" width="900" height="900">
            <img class="snow-patch snow-patch-right" src="assets/web/decorations/snow_2.webp" alt="" width="900" height="900">
            <nav id="village-houses" aria-label="Bereits enthüllte Häuschen"></nav>
            <div class="snow-bank snow-bank-front" aria-hidden="true"></div>
        </div>
        <p class="village-hint">Jeden Tag ein neues Häuschen. <span>Klicke auf ein Häuschen und schau noch einmal vorbei.</span></p>
    </footer>

    <div class="arrival" id="arrival" aria-hidden="true" hidden>
        <div class="arrival-wash"></div>
        <img id="arrival-house" alt="" width="736" height="736">
        <div class="arrival-copy"><span id="arrival-day"></span><p>Ein kleiner Moment für dich.</p></div>
        <button class="text-button arrival-skip" id="arrival-skip" type="button">Direkt zum Inhalt <span aria-hidden="true">↓</span></button>
    </div>
    <div class="sr-only" id="page-status" role="status" aria-live="polite"></div>
</body>
</html>
